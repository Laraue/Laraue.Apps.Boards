# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - "5432:5432"
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run all tests
      run: dotnet test -c Release --no-build

    - name: Pack Telegram Host
      if: github.ref == 'refs/heads/main'
      run: tar -czf telegram-host.tar.gz -C src/Laraue.Apps.Boards.TelegramHost/bin/Release/net10.0 .

    - name: Upload Telegram Host artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: telegram-host
        path: telegram-host.tar.gz
        retention-days: 7

    - name: Pack Web API Host
      if: github.ref == 'refs/heads/main'
      run: tar -czf webapi-host.tar.gz -C src/Laraue.Apps.Boards.WebApiHost/bin/Release/net10.0 .

    - name: Upload Web API Host artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: webapi-host
        path: webapi-host.tar.gz
        retention-days: 7

    - name: Pack Retro Web API Host
      if: github.ref == 'refs/heads/main'
      run: tar -czf retro-webapi-host.tar.gz -C src/Laraue.Apps.Retro.WebApiHost/bin/Release/net10.0 .

    - name: Upload Retro Web API Host artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: retro-webapi-host
        path: retro-webapi-host.tar.gz
        retention-days: 7

  deploy-telegram-host:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: telegram-production
    steps:
    - name: Download Telegram Host artifact
      uses: actions/download-artifact@v4
      with:
        name: telegram-host

    - name: Upload Telegram Host
      uses: marcodallasanta/ssh-scp-deploy@v1.2.0
      with:
       host: ${{ secrets.SSH_HOST }} # "example.com"
       port: ${{ secrets.SSH_PORT }} # 22
       user: ${{ secrets.SSH_USER }} # "user"
       password: ${{ secrets.SSH_PASSWORD }} # "password"
       local: telegram-host.tar.gz
       remote: "/home/laraue/boards-telegram-host"
       post_upload:
        cd /home/laraue/boards-telegram-host && find . -mindepth 1 ! -name telegram-host.tar.gz -delete &&
        tar -xzf telegram-host.tar.gz && rm telegram-host.tar.gz

  deploy-webapi-host:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: webapi-production
    steps:
    - name: Download Web API Host artifact
      uses: actions/download-artifact@v4
      with:
        name: webapi-host

    - name: Upload Web API Host
      uses: marcodallasanta/ssh-scp-deploy@v1.2.0
      with:
       host: ${{ secrets.SSH_HOST }} # "example.com"
       port: ${{ secrets.SSH_PORT }} # 22
       user: ${{ secrets.SSH_USER }} # "user"
       password: ${{ secrets.SSH_PASSWORD }} # "password"
       local: webapi-host.tar.gz
       remote: "/home/laraue/boards-webapi-host"
       post_upload:
        cd /home/laraue/boards-webapi-host && find . -mindepth 1 ! -name webapi-host.tar.gz -delete &&
        tar -xzf webapi-host.tar.gz && rm webapi-host.tar.gz

  deploy-retro-webapi-host:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: retro-webapi-production
    steps:
    - name: Download Retro Web API Host artifact
      uses: actions/download-artifact@v4
      with:
        name: retro-webapi-host

    - name: Upload Retro Web API Host
      uses: marcodallasanta/ssh-scp-deploy@v1.2.0
      with:
       host: ${{ secrets.SSH_HOST }} # "example.com"
       port: ${{ secrets.SSH_PORT }} # 22
       user: ${{ secrets.SSH_USER }} # "user"
       password: ${{ secrets.SSH_PASSWORD }} # "password"
       local: retro-webapi-host.tar.gz
       remote: "/home/laraue/retro-webapi-host"
       post_upload:
        cd /home/laraue/retro-webapi-host && find . -mindepth 1 ! -name retro-webapi-host.tar.gz -delete &&
        tar -xzf retro-webapi-host.tar.gz && rm retro-webapi-host.tar.gz
